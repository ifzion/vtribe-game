<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Tribe Wars — $VTRIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--soot:#0c0a08;--ash:#16130f;--bark:#3a2e22;--bone:#e8dcc8;--dust:#9a8b76;--ember:#e85d04;--gold:#d4a017;--tribe:#c084fc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Outfit,sans-serif;background:var(--soot);color:var(--bone);min-height:100vh;overflow:hidden;touch-action:manipulation}
canvas{display:block}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;pointer-events:none;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.plaque{background:linear-gradient(180deg,rgba(28,22,16,.92),rgba(12,10,8,.92));border:1px solid var(--bark);padding:10px 12px;min-width:170px;max-width:46vw}
.plaque.right{text-align:right}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.plaque.right .who{flex-direction:row-reverse}
.who .ic{font-size:18px}
.who .nm{font-weight:700;font-size:13px;letter-spacing:.04em}
.hp-row{display:flex;align-items:center;gap:8px}
.plaque.right .hp-row{flex-direction:row-reverse}
.hp-bar{flex:1;height:8px;background:#1a140e;border:1px solid #2c241a;overflow:hidden}
.hp-fill{height:100%;width:100%;background:#7dce82;transition:width .25s}
.hp-num{font-size:11px;color:var(--dust);font-variant-numeric:tabular-nums;min-width:44px}
.meta{margin-top:6px;font-size:10px;color:var(--dust);letter-spacing:.08em;text-transform:uppercase}
.center-hud{text-align:center;pointer-events:none}
.combo{font-family:Cinzel,serif;font-size:18px;color:var(--gold);min-height:22px}
.kills{font-size:11px;color:var(--dust);letter-spacing:.16em;text-transform:uppercase}
.controls{position:fixed;left:16px;right:16px;bottom:18px;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.cluster{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:62px;height:62px;border-radius:50%;background:rgba(22,19,15,.75);border:1px solid var(--bark);color:var(--bone);font-size:20px;display:grid;place-items:center;user-select:none;backdrop-filter:blur(6px)}
.ctrl:active{transform:scale(.96);background:rgba(58,46,34,.9)}
.ctrl-attack{width:74px;height:74px;border-color:var(--ember);color:#ffb089;background:rgba(232,93,4,.18)}
.ctrl-ability{border-color:var(--tribe);color:var(--tribe)}
.start,.game-over{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 500px at 50% 0%,rgba(232,93,4,.16),transparent 55%),rgba(8,6,4,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;overflow:auto}
.game-over{display:none}
.game-over.show{display:flex}
.eyebrow{color:var(--gold);letter-spacing:.28em;font-size:11px;text-transform:uppercase;margin-bottom:8px}
.start h1,.game-over h2{font-family:Cinzel,serif;font-size:clamp(28px,7vw,44px);margin-bottom:8px}
.start p,.hint{color:var(--dust);font-size:14px;max-width:420px;text-align:center;margin-bottom:18px}
.record{display:flex;gap:18px;color:var(--dust);font-size:12px;margin-bottom:22px;letter-spacing:.08em}
.record b{color:var(--bone)}
.char-select{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;justify-content:center;max-width:720px}
.char-card{width:122px;padding:14px 10px 12px;background:var(--ash);border:1px solid var(--bark);cursor:pointer;text-align:center;transition:border-color .15s,transform .15s}
.char-card:hover{border-color:#6a563d}
.char-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.char-card .icon{font-size:26px;margin-bottom:6px}
.char-card .name{font-family:Cinzel,serif;font-size:12px;margin-bottom:8px}
.stats{display:flex;justify-content:space-between;font-size:9px;color:var(--dust);letter-spacing:.04em;margin-bottom:8px}
.abil{font-size:10px;color:var(--gold);line-height:1.3}
.btn{padding:14px 32px;border:none;color:#1a0e04;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:Outfit,sans-serif}
.btn-go{background:linear-gradient(180deg,#f3c14a,var(--gold) 40%,#a36b08)}
.btn-go:active{transform:scale(.97)}
.btn-tw{background:transparent;color:var(--bone);border:1px solid var(--bark);margin-top:10px}
.result{font-family:Cinzel,serif;font-size:36px;color:var(--gold);margin:6px 0 16px}
.stats-box{background:var(--ash);border:1px solid var(--bark);padding:14px 16px;width:min(280px,90vw);margin-bottom:18px;font-size:13px}
.stats-box div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2218}
.stats-box div:last-child{border-bottom:none}
.k{color:var(--dust)}
.v{font-weight:600}
.ability-popup{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);border:1px solid var(--gold);background:rgba(12,10,8,.85);padding:10px 18px;color:var(--gold);font-size:13px;letter-spacing:.08em;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;text-transform:uppercase}
.ability-popup.show{opacity:1}
.back{position:fixed;top:16px;left:16px;z-index:110;color:var(--dust);text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:640px){.char-card{width:calc(50% - 8px)}.plaque{min-width:0;flex:1}.center-hud{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<a href="index.html" class="back" id="backHome" style="display:none">← Camp</a>

<div class="hud" id="hud" style="display:none">
<div class="plaque">
<div class="who"><span class="ic" id="playerIcon">💜</span><span class="nm" id="playerName">You</span></div>
<div class="hp-row">
<div class="hp-bar"><div class="hp-fill" id="playerHP"></div></div>
<span class="hp-num" id="playerHPNum">100</span>
</div>
<div class="meta" id="playerMeta">Ability ready</div>
</div>
<div class="center-hud">
<div class="combo" id="comboDisplay"></div>
<div class="kills" id="killsDisplay">0 fallen</div>
</div>
<div class="plaque right">
<div class="who"><span class="ic" id="enemyIcon">🔥</span><span class="nm" id="enemyName">Enemy</span></div>
<div class="hp-row">
<div class="hp-bar"><div class="hp-fill" id="enemyHP"></div></div>
<span class="hp-num" id="enemyHPNum">100</span>
</div>
<div class="meta" id="enemyMeta">Challenger</div>
</div>
</div>

<div class="controls" id="controls" style="display:none">
<div class="cluster">
<div class="ctrl" id="btnLeft">←</div>
<div class="ctrl" id="btnRight">→</div>
</div>
<div class="cluster">
<div class="ctrl ctrl-ability" id="btnAbility">✦</div>
<div class="ctrl" id="btnDodge">🛡</div>
<div class="ctrl ctrl-attack" id="btnAttack">⚔</div>
</div>
</div>

<div class="ability-popup" id="abilityPopup"></div>

<div class="start" id="startScreen">
<div class="eyebrow">$VTRIBE · Season 0</div>
<h1>Tribe Wars</h1>
<p>Choose your clan. Close the distance. End the fight.</p>
<div class="record"><span>XP <b id="recXP">0</b></span><span>Wins <b id="recWins">0</b></span><span>Losses <b id="recLosses">0</b></span></div>
<div class="char-select" id="charSelect"></div>
<button class="btn btn-go" onclick="startGame()">Start battle</button>
<p class="hint">A/D move · W jump · Space attack · Shift dodge · E ability</p>
</div>

<div class="game-over" id="go">
<div class="eyebrow" id="goTitle">The pit is quiet</div>
<h2 id="goSubtitle">Defeated</h2>
<div class="result" id="goResult">+10 XP</div>
<div class="stats-box" id="goStats"></div>
<button class="btn btn-go" onclick="startGame()">Fight again</button>
<button class="btn btn-tw" onclick="share()">Share the bout</button>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,GROUND;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;GROUND=H-100}
resize();addEventListener('resize',resize);

const TRIBES=[
{id:'phoenix',name:'Phoenix',icon:'🔥',color:'#ff4d1a',hp:100,atk:15,spd:3,ability:'Rebirth',abilityDesc:'Revive at 50% HP',abilityCD:999},
{id:'vtribe',name:'Vibe Tribe',icon:'💜',color:'#ff6b9d',hp:100,atk:12,spd:3.5,ability:'Unity',abilityDesc:'+30% ATK when HP<50%',abilityCD:60},
{id:'ignite',name:'Spark',icon:'⚡',color:'#ffe14a',hp:90,atk:18,spd:4,ability:'Lightning',abilityDesc:'2x damage crit (30%)',abilityCD:45},
{id:'mwalk',name:'Moon',icon:'🌙',color:'#7ec8ff',hp:110,atk:10,spd:2.5,ability:'Gravity',abilityDesc:'Slow enemy 50% for 3s',abilityCD:60},
{id:'cnmd',name:'Nomad',icon:'🔔',color:'#c4a35a',hp:95,atk:14,spd:3,ability:'Alert',abilityDesc:'See enemy next attack',abilityCD:30}
];

let player,enemies,particles,floatingTexts;
let gameActive,selectedChar=1,currentEnemy;
let score,kills,combo,bestCombo,damageDealt,damageTaken;
let abilityCooldown,abilityActive,abilityTimer;
let shakeMag,hitStop,frameCount;
let keys={};

const LS='tribe_v3';
let save=JSON.parse(localStorage.getItem(LS)||'{}');
let xp=save.xp||0,wins=save.wins||0,losses=save.losses||0;

function init(){
document.getElementById('recXP').textContent=xp;
document.getElementById('recWins').textContent=wins;
document.getElementById('recLosses').textContent=losses;
const sel=document.getElementById('charSelect');
sel.innerHTML=TRIBES.map((t,i)=>`
<div class="char-card${i===selectedChar?' sel':''}" onclick="selectChar(${i})">
<div class="icon">${t.icon}</div>
<div class="name">${t.name}</div>
<div class="stats"><span>HP ${t.hp}</span><span>ATK ${t.atk}</span><span>SPD ${t.spd}</span></div>
<div class="abil">${t.ability}: ${t.abilityDesc}</div>
</div>`).join('');
}

function selectChar(idx){
selectedChar=idx;
document.querySelectorAll('.char-card').forEach((c,i)=>c.classList.toggle('sel',i===idx));
}

function startGame(){
document.getElementById('startScreen').style.display='none';
document.getElementById('backHome').style.display='none';
document.getElementById('go').classList.remove('show');
document.getElementById('hud').style.display='flex';
document.getElementById('controls').style.display='flex';

const t=TRIBES[selectedChar];
player={x:W*.3,y:GROUND-40,w:32,h:40,hp:t.hp,maxHP:t.hp,atk:t.atk,spd:t.spd,color:t.color,icon:t.icon,name:t.name,vx:0,vy:0,grounded:true,facing:1,state:'idle',stateTimer:0,ability:t.ability,abilityDesc:t.abilityDesc,abilityCD:t.abilityCD};

enemies=[];particles=[];floatingTexts=[];
score=0;kills=0;combo=0;bestCombo=0;
damageDealt=0;damageTaken=0;
abilityCooldown=0;abilityActive=false;abilityTimer=0;
shakeMag=0;hitStop=0;frameCount=0;gameActive=true;

document.getElementById('playerIcon').textContent=t.icon;
document.getElementById('playerName').textContent=t.name;
spawnEnemy();updateHUD();gameLoop();
}

function spawnEnemy(){
const idx=Math.floor(Math.random()*TRIBES.length);
const t=TRIBES[idx];
const level=1+kills*.2;
currentEnemy={x:W*.7,y:GROUND-40,w:32,h:40,hp:Math.floor(t.hp*level),maxHP:Math.floor(t.hp*level),atk:Math.floor(t.atk*level),spd:t.spd*.8,color:t.color,icon:t.icon,name:t.name,vx:0,vy:0,grounded:true,facing:-1,state:'idle',stateTimer:0,aiTimer:0,aiState:'approach'};
document.getElementById('enemyIcon').textContent=t.icon;
document.getElementById('enemyName').textContent=t.name;
document.getElementById('enemyMeta').textContent='Rank '+(kills+1);
}

function attack(){
if(!gameActive||player.state==='attack'||player.state==='dodge')return;
player.state='attack';player.stateTimer=15;
const dx=Math.abs(player.x-currentEnemy.x),dy=Math.abs(player.y-currentEnemy.y);
if(dx<60&&dy<40){
let dmg=player.atk+Math.floor(Math.random()*5);
let crit=false;
if(player.ability==='Lightning'&&Math.random()<.3){dmg*=2;crit=true;}
if(player.ability==='Unity'&&player.hp<player.maxHP*.5)dmg=Math.floor(dmg*1.3);
currentEnemy.hp=Math.max(0,currentEnemy.hp-dmg);
damageDealt+=dmg;
currentEnemy.vx=player.facing*5;currentEnemy.vy=-3;
spawnHitParticles(currentEnemy.x,currentEnemy.y-20,currentEnemy.color);
floatingTexts.push({x:currentEnemy.x,y:currentEnemy.y-40,text:(crit?'💥 ':'')+dmg,color:crit?'#d4a017':'#e8dcc8',life:30});
shake(crit?8:4);hitStop=crit?8:4;
combo++;if(combo>bestCombo)bestCombo=combo;
if(currentEnemy.hp<=0)enemyDefeated();
}
}

function dodge(){
if(!gameActive||player.state==='dodge')return;
player.state='dodge';player.stateTimer=20;
player.vx=player.facing*-8;player.vy=-4;
showAbility('Dodge!');
}

function useAbility(){
if(!gameActive||abilityCooldown>0)return;
abilityCooldown=player.abilityCD;abilityActive=true;abilityTimer=180;
switch(player.ability){
case'Rebirth':showAbility('Rebirth primed');break;
case'Unity':showAbility('Unity active');break;
case'Lightning':showAbility('Lightning strike');currentEnemy.hp=Math.max(0,currentEnemy.hp-player.atk*3);spawnHitParticles(currentEnemy.x,currentEnemy.y-20,'#ffe14a');shake(12);if(currentEnemy.hp<=0)enemyDefeated();break;
case'Gravity':showAbility('Gravity well');currentEnemy.spd*=.5;break;
case'Alert':showAbility('Next: '+(currentEnemy.aiState==='attack'?'ATTACK':'APPROACH'));break;
}
}

function showAbility(text){const el=document.getElementById('abilityPopup');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500);}

function enemyDefeated(){kills++;combo++;score+=100+kills*10;spawnDeathParticles(currentEnemy.x,currentEnemy.y-20,currentEnemy.color);setTimeout(()=>{if(gameActive)spawnEnemy();},1000);}

function spawnHitParticles(x,y,color){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-2,life:20+Math.random()*10,color,size:3+Math.random()*3});}
function spawnDeathParticles(x,y,color){for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12-4,life:30+Math.random()*20,color,size:4+Math.random()*4});}
function shake(mag){shakeMag=Math.max(shakeMag,mag);}

function update(){
if(!gameActive)return;frameCount++;
if(hitStop>0){hitStop--;return;}

player.vx*=.85;player.vy+=.4;player.x+=player.vx;player.y+=player.vy;
if(player.y>=GROUND-player.h){player.y=GROUND-player.h;player.vy=0;player.grounded=true;}
player.x=Math.max(player.w,Math.min(W-player.w,player.x));
if(player.stateTimer>0)player.stateTimer--;else player.state='idle';

if(currentEnemy){
const dx=player.x-currentEnemy.x,dist=Math.abs(dx);
currentEnemy.aiTimer++;
if(currentEnemy.aiState==='approach'){currentEnemy.x+=Math.sign(dx)*currentEnemy.spd;currentEnemy.facing=Math.sign(dx);if(dist<50){currentEnemy.aiState='attack';currentEnemy.aiTimer=0;}}
else if(currentEnemy.aiState==='attack'){if(currentEnemy.aiTimer>30){if(dist<60){let dmg=currentEnemy.atk+Math.floor(Math.random()*3);if(player.state==='dodge'){showAbility('Dodged!');dmg=0;}if(dmg>0){player.hp=Math.max(0,player.hp-dmg);damageTaken+=dmg;player.vx=-Math.sign(dx)*4;player.vy=-3;spawnHitParticles(player.x,player.y-20,player.color);floatingTexts.push({x:player.x,y:player.y-40,text:'-'+dmg,color:'#e85d04',life:30});shake(5);combo=0;}}currentEnemy.aiState='retreat';currentEnemy.aiTimer=0;}}
else if(currentEnemy.aiState==='retreat'){currentEnemy.x-=Math.sign(dx)*currentEnemy.spd;if(currentEnemy.aiTimer>40){currentEnemy.aiState='approach';currentEnemy.aiTimer=0;}}

currentEnemy.vx*=.85;currentEnemy.vy+=.4;currentEnemy.x+=currentEnemy.vx;currentEnemy.y+=currentEnemy.vy;
if(currentEnemy.y>=GROUND-currentEnemy.h){currentEnemy.y=GROUND-currentEnemy.h;currentEnemy.vy=0;}
currentEnemy.x=Math.max(currentEnemy.w,Math.min(W-currentEnemy.w,currentEnemy.x));
if(currentEnemy.stateTimer>0)currentEnemy.stateTimer--;else currentEnemy.state='idle';
}

if(abilityCooldown>0)abilityCooldown--;
if(abilityActive){abilityTimer--;if(abilityTimer<=0)abilityActive=false;}

particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0;});
floatingTexts=floatingTexts.filter(f=>{f.y-=1;f.life--;return f.life>0;});
shakeMag*=.9;if(shakeMag<.5)shakeMag=0;

if(player.hp<=0){
if(player.ability==='Rebirth'&&abilityActive){player.hp=Math.floor(player.maxHP*.5);abilityActive=false;showAbility('REBIRTH!');spawnHitParticles(player.x,player.y-20,'#ff4d1a');}
else gameOver(false);
}

updateHUD();
}

function drawChar(char,isPlayer){
cx.save();cx.translate(char.x,char.y);cx.scale(char.facing,1);
cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(0,char.h,char.w*.8,6,0,0,Math.PI*2);cx.fill();
const dark=adjustColor(char.color,-30);
const legPhase=Math.sin(frameCount*.15)*3;
cx.fillStyle=dark;cx.fillRect(-8,char.h-12,6,12+legPhase);cx.fillRect(2,char.h-12,6,12-legPhase);
cx.fillStyle=char.color;cx.fillRect(-char.w/2,-char.h/2,char.w,char.h);
cx.fillStyle=adjustColor(char.color,20);cx.fillRect(-char.w/2,-char.h/2,char.w,char.h/3);
cx.fillStyle=char.color;cx.fillRect(-12,-char.h/2-18,24,24);
cx.fillStyle='#e8dcc8';cx.fillRect(-8,-char.h/2-12,6,6);cx.fillRect(2,-char.h/2-12,6,6);
cx.fillStyle='#0c0a08';cx.fillRect(-6,-char.h/2-10,3,3);cx.fillRect(4,-char.h/2-10,3,3);
cx.fillStyle=dark;
if(char.state==='attack'){cx.fillRect(char.w/2,-10,12,6);cx.fillRect(char.w/2+8,-12,6,10);}
else{cx.fillRect(char.w/2,-8,6,16);cx.fillRect(-char.w/2-6,-8,6,16);}
if(isPlayer&&abilityActive){cx.fillStyle=char.color+'33';cx.beginPath();cx.arc(0,0,40,0,Math.PI*2);cx.fill();}
cx.restore();
}

function draw(){
cx.save();
if(shakeMag>0)cx.translate((Math.random()-.5)*shakeMag,(Math.random()-.5)*shakeMag);

const sky=cx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,'#1a1018');sky.addColorStop(.45,'#24140c');sky.addColorStop(.72,'#3a1c0c');sky.addColorStop(1,'#1a120c');
cx.fillStyle=sky;cx.fillRect(0,0,W,H);

cx.fillStyle='rgba(232,220,190,.55)';
for(let i=0;i<60;i++){const x=(i*41+frameCount*.08)%W,y=(i*29)%H;cx.beginPath();cx.arc(x,y,.8,0,Math.PI*2);cx.fill();}

cx.fillStyle='#2a1e14';cx.fillRect(0,GROUND,W,H-GROUND);
cx.fillStyle='#3a2e22';cx.fillRect(0,GROUND,W,2);

if(currentEnemy)drawChar(currentEnemy,false);
drawChar(player,true);

particles.forEach(p=>{cx.fillStyle=p.color;cx.globalAlpha=p.life/30;cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill();});
cx.globalAlpha=1;
floatingTexts.forEach(f=>{cx.fillStyle=f.color;cx.globalAlpha=f.life/30;cx.font='700 16px Outfit,sans-serif';cx.textAlign='center';cx.fillText(f.text,f.x,f.y);});
cx.globalAlpha=1;cx.restore();
}

function adjustColor(hex,amt){
const r=Math.max(0,Math.min(255,parseInt(hex.slice(1,3),16)+amt));
const g=Math.max(0,Math.min(255,parseInt(hex.slice(3,5),16)+amt));
const b=Math.max(0,Math.min(255,parseInt(hex.slice(5,7),16)+amt));
return`rgb(${r},${g},${b})`;
}

function updateHUD(){
document.getElementById('playerHP').style.width=(player.hp/player.maxHP*100)+'%';
document.getElementById('playerHPNum').textContent=Math.max(0,Math.round(player.hp));
document.getElementById('playerMeta').textContent=abilityCooldown>0?'Cooldown '+Math.ceil(abilityCooldown/60)+'s':'Ability ready';
if(currentEnemy){
document.getElementById('enemyHP').style.width=(currentEnemy.hp/currentEnemy.maxHP*100)+'%';
document.getElementById('enemyHPNum').textContent=Math.max(0,Math.round(currentEnemy.hp));
}
document.getElementById('comboDisplay').textContent=combo>1?'×'+combo:'';
document.getElementById('killsDisplay').textContent=kills+' fallen';
}

function gameOver(won){
gameActive=false;
if(won){wins++;xp+=50+kills*10;}else{losses++;xp+=10+kills*5;}
localStorage.setItem(LS,JSON.stringify({xp,wins,losses}));
document.getElementById('goSubtitle').textContent=won?'Victory':'Defeated';
document.getElementById('goResult').textContent='+'+(won?50+kills*10:10+kills*5)+' XP';
document.getElementById('goStats').innerHTML=`
<div><span class="k">Kills</span><span class="v">${kills}</span></div>
<div><span class="k">Best Combo</span><span class="v">${bestCombo}</span></div>
<div><span class="k">Damage Dealt</span><span class="v">${damageDealt}</span></div>
<div><span class="k">Damage Taken</span><span class="v">${damageTaken}</span></div>
<div><span class="k">Total XP</span><span class="v">${xp}</span></div>`;
document.getElementById('go').classList.add('show');
}

function share(){
const text=`⚔️ Tribe Wars — $VTRIBE\n\n${player.icon} ${player.name} defeated ${kills} enemies!\nBest Combo: ${bestCombo}\nDamage Dealt: ${damageDealt}\n\nPlay: [link]\n@vibevibe_fun`;
open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
}

document.getElementById('btnLeft').addEventListener('pointerdown',()=>{keys.left=true;});
document.getElementById('btnLeft').addEventListener('pointerup',()=>{keys.left=false;});
document.getElementById('btnRight').addEventListener('pointerdown',()=>{keys.right=true;});
document.getElementById('btnRight').addEventListener('pointerup',()=>{keys.right=false;});
document.getElementById('btnAttack').addEventListener('pointerdown',attack);
document.getElementById('btnDodge').addEventListener('pointerdown',dodge);
document.getElementById('btnAbility').addEventListener('pointerdown',useAbility);

addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='z')attack();if(e.key==='Shift'||e.key==='x')dodge();if(e.key==='e'||e.key==='q')useAbility();});
addEventListener('keyup',e=>{keys[e.key]=false;});

function handleInput(){
if(keys.left||keys.a){player.vx=-player.spd;player.facing=-1;}
if(keys.right||keys.d){player.vx=player.spd;player.facing=1;}
if((keys.up||keys.w)&&player.grounded){player.vy=-8;player.grounded=false;}
}

function gameLoop(){
if(!gameActive)return;
handleInput();update();draw();
requestAnimationFrame(gameLoop);
}

init();
</script>
</body>
</html>
